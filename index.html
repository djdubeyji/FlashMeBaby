@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#131f24;--card:#1f2c33;--tx:#e8eef0;--mut:#9fb0b8;--line:#2f4048}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.4 'Nunito',system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 16px 96px}
.bar{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-weight:800;margin-bottom:16px}.bar .logo{cursor:pointer;font-weight:900;font-size:18px;text-align:center;white-space:nowrap}.bar .st{white-space:nowrap}.bar .btn{justify-self:end}
#splash{position:fixed;inset:0;z-index:20;background:var(--bg);color:var(--tx);transition:background .6s .2s}
#splash b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:40px;font-weight:900;white-space:nowrap;display:flex;transition:top .8s cubic-bezier(.6,0,.2,1),font-size .8s}
#splash b span{display:inline-block;animation:pop .5s both}
@keyframes pop{0%{opacity:0;transform:translateY(24px) scale(.5)}70%{transform:translateY(-8px) scale(1.15)}100%{opacity:1;transform:none}}
#splash i{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:56px;font-style:normal;animation:flash .6s .6s infinite alternate;transition:opacity .4s}
@keyframes flash{to{transform:translateX(-50%) scale(1.3);filter:brightness(1.4)}}
#splash.out{background:transparent;pointer-events:none}#splash.out b{top:calc(env(safe-area-inset-top,0px) + 34px);font-size:18px}#splash.out i{opacity:0}
.btn{font:inherit;font-weight:800;border:0;border-bottom:4px solid var(--bd,#46a302);border-radius:16px;padding:12px 16px;background:var(--bc,#58cc02);color:#1c1c1c;cursor:pointer}
.btn:active{transform:translateY(4px);border-bottom-width:0;margin-bottom:4px}
.btn.p{--bc:#ce82ff;--bd:#a559d6}.btn.y{--bc:#ffc800;--bd:#d9a800}.btn.r{--bc:#ff4b4b;--bd:#d33131}
.btn.gh{--bc:var(--card);--bd:var(--line);color:var(--tx);border:2px solid var(--line);border-bottom-width:4px}.btn.on{--bc:#58cc02;--bd:#46a302;color:#1c1c1c}
.btn.sm{padding:6px 12px;border-radius:12px}
:focus-visible{outline:3px solid #1cb0f6;outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}
.tile{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;background:var(--card);color:var(--tx);padding:12px;font:inherit;font-weight:800;cursor:pointer}
.ring{width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring i{width:28px;height:28px;border-radius:50%;background:var(--card)}
.card{min-height:220px;border:2px solid var(--line);border-bottom-width:6px;border-radius:24px;background:var(--card);padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:pan-y;user-select:none;transition:transform .2s,background .2s;gap:8px;margin:12px 0}
.big{font-size:32px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}.a{color:#46a302}@media (prefers-color-scheme:dark){.a{color:#7fe02c}}
.lab,.tag,small{font:700 12px 'JetBrains Mono',ui-monospace,monospace;color:var(--mut)}
.meta{display:flex;gap:8px;align-items:center;justify-content:space-between}.meta span{font-weight:800}
.fb{font-weight:700}hr{width:60%;border:0;border-top:2px solid var(--line)}
input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--tx);margin:4px 0 12px}
label{font-weight:800;font-size:14px}h2{margin:8px 0}
.box{border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;background:var(--card)}
.warn{background:#ffc800;color:#1c1c1c;padding:8px 12px;border-radius:12px;font-weight:700;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line)}nav .btn{flex:1}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#ffc800;color:#1c1c1c;font-weight:900;padding:10px 18px;border-radius:16px;z-index:9;display:none}
.cf{position:fixed;top:-10px;width:10px;height:14px;border-radius:2px;z-index:8;animation:fall 1.8s linear forwards}@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.bar .logo{display:flex;align-items:center;gap:6px;justify-content:center}.bar .logo img{width:34px;height:34px;object-fit:contain}
#splash .sp{position:absolute;left:50%;top:60%;transform:translateX(-50%);width:132px;height:132px;border-radius:50%;object-fit:cover;border:4px solid #ce82ff;animation:flash .6s .6s infinite alternate;transition:opacity .4s}#splash.out .sp{opacity:0}
.hero{display:flex;gap:14px;align-items:center;margin:4px 0 16px}.hero img{width:84px;height:84px;object-fit:contain;flex:none}.hero p{margin:2px 0 0;color:var(--mut);font-weight:700}
.tile.sel{border-color:#ff4b4b;box-shadow:0 0 0 3px color-mix(in srgb,#ff4b4b 30%,transparent)}
.launch{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px 14px;margin:16px -16px 0;background:var(--bg);border-top:2px solid var(--line);z-index:2}
.launch small{max-width:150px}
.nope{width:92px;height:92px;flex:none;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ff9a9a,#ff4b4b 45%,#c41f1f);box-shadow:0 8px 0 #8f1010,0 12px 22px #0005;color:#fff;font:900 16px/1.05 'Nunito',sans-serif;cursor:pointer;text-shadow:0 2px 0 #0006;transition:transform .08s,box-shadow .08s;animation:tempt 2.6s ease-in-out infinite}
.nope:active{transform:translateY(7px);box-shadow:0 1px 0 #8f1010,0 3px 8px #0004;animation:none}
@keyframes tempt{0%,80%,100%{transform:none}86%{transform:rotate(-6deg) scale(1.05)}92%{transform:rotate(6deg) scale(1.05)}}
.sum{text-align:center}.sum .pc{font-size:44px;font-weight:900;margin:0}.sum p{font-weight:700}
.dance{display:flex;flex-direction:column;align-items:center;color:var(--tx)}.dance p{margin:0;font-weight:800;color:#ce82ff}
@keyframes twerk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(8px) rotate(4deg)}}
@keyframes lean{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(-22deg)}}
.rk{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:8px}.rk i{display:block;height:100%;background:#ce82ff}
.warn{cursor:pointer}
#intro{cursor:pointer}#intro:focus{outline:none}
body.prac nav{display:none}body.prac #app{padding-bottom:12px}
.pw{display:flex;flex-direction:column;height:calc(100dvh - 86px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:440px}
.pw .big small{display:block;font-size:14px;margin-top:6px}.pw .card{flex:1;min-height:0;margin:6px 0 10px;position:relative;overflow:hidden}.pw .big{font-size:clamp(30px,8vw,44px)}.pw .ctl{margin:0}.pw .ctl .btn{padding:16px}.pw input{margin:0 0 8px}
.last{min-height:38px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}.last .btn{margin-left:auto}.last .r{color:#46a302}.last .w{color:#ff4b4b}.last .s{color:#d9a800}
.stamp{position:absolute;top:18px;padding:4px 10px;border:3px solid currentColor;border-radius:10px;font-weight:900;font-size:20px;opacity:0;pointer-events:none}
.stamp.sl{left:16px;color:#ff4b4b;transform:rotate(-12deg)}.stamp.sr{right:16px;color:#58cc02;transform:rotate(12deg)}
.spk{position:absolute;right:14px;bottom:14px;font-size:20px}
.dots{color:#ff4b4b;letter-spacing:3px;font-size:14px}
#flash{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:120px;font-weight:900;opacity:0;pointer-events:none;z-index:9;text-shadow:0 4px 18px #0003}
#flash.go{animation:fl .65s ease-out}@keyframes fl{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
#intro{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--tx);display:flex;align-items:center;justify-content:center;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .4s}
#intro.out{opacity:0;pointer-events:none}#intro .tap{cursor:pointer}
#intro .ist{max-width:440px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:rise .45s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#intro .art{height:min(52vh,420px);width:auto;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(-1deg)}}
#intro .nm{display:flex;margin:0;font-size:38px;font-weight:900}#intro .nm span{display:inline-block;animation:pop .5s both}
#intro .tg{margin:0;color:var(--mut);font-weight:700;font-size:17px}
#intro .cheek{font-size:30px;font-weight:900;line-height:1.2;margin:0 0 12px}#intro .cheek small{font-size:16px;color:var(--mut);font-weight:700}
#intro .wotd{font-size:40px;font-weight:900;margin:4px 0;overflow-wrap:anywhere;hyphens:auto;color:#ce82ff}
.nope.big{width:190px;height:190px;font-size:30px;margin:28px 0 12px;box-shadow:0 12px 0 #8f1010,0 18px 30px #0005}
.nope.big:active{transform:translateY(11px);box-shadow:0 1px 0 #8f1010,0 4px 10px #0004}
.bar .st{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis}@media (max-width:460px){.bar .lt{display:none}.bar{grid-template-columns:1fr auto auto}.bar .st{font-size:14px}}
</style></head><body><div id="toast" role="status"></div><div id="app"></div>

const seg=(k,o)=>`<div class="row">${o.map(([v,t])=>`<button class="btn gh ${S[k]===v?'on':''}" aria-pressed="${S[k]===v}" onclick="S.${k}='${v}';save();render()">${t}</button>`).join('')}</div>`;
return `<div class="hero"><img src="${ICON}" alt=""><div><b>Ready to get flashed?</b><p>Tap a level or topic to start a round.</p></div></div><h2>Pick a level</h2><div class="grid">${tile('A1','A1',prog('A1'),'#58cc02')}${tile('A2','A2',prog('A2'),'#1cb0b0')}${tile('B1','B1',prog('B1'),'#ce82ff')}${tile('B2','B2',prog('B2'),'#ff9600')}${tile('C1','C1',prog('C1'),'#e0457b')}${tile('C2','C2',prog('C2'),'#1cb0f6')}${tile('MIX','Mixed',0,'#ffc800')}${tile('MY','My words ('+WL.filter(w=>w.level==='MY').length+')',0,'#1cb0f6')}${tile('MISSED','Missed words ('+missedN()+')',0,'#ff4b4b')}</div>
<h2>Direction</h2>${seg('dir',[['ED','EN→DE'],['DE','DE→EN'],['RND','Random']])}<h2>Mode</h2>${seg('mode',[['swipe','Swipe'],['type','Type']])}<h2>Practice by topic</h2><small>Work topics first, then everyday life</small><div class="grid" style="margin-top:8px">${torder().map(i=>{const t=TOPICS[i],a=all().filter(w=>inT(w,i));return tile('T:'+i,t.replace(/&/g,'&amp;'),a.length?Math.round(100*a.filter(w=>g(w.id).seen).length/a.length):0,i>=16&&i<=18?['#1cb0f6','#ff9600','#ff4b4b'][i-16]:['#58cc02','#ce82ff','#1cb0f6','#ffc800'][i%4])}).join('')}</div>`},
practice(){if(!P)return views.start();const c=P.q[P.i],d=P.d[P.i],sw=S.mode==='swipe',pr=d==='ED'?c.en:art(c)+c.de,an=d==='ED'?esc(art(c)+c.de)+(c.plural?`<small>Plural: ${esc(c.plural)}</small>`:''):esc(c.en),t=g(c.id),showDe=d==='DE'||P.s!=='ask';
const st=P.s==='ask'?['DON’T KNOW','KNOW IT']:P.s==='flip'?['✗ WRONG','RIGHT ✓']:['NEXT','NEXT'];
let ctl='';if(sw)ctl=P.s==='ask'?`<div class="row ctl"><button class="btn r" onclick="act(-1)">← Don’t know</button><button class="btn" onclick="act(1)">I know it →</button></div>`:P.s==='flip'?`<div class="row ctl"><button class="btn r" onclick="act(-1)">← ✗ I was wrong</button><button class="btn" onclick="act(1)">I was right ✓ →</button></div>`:`<div class="row ctl"><button class="btn gh" id="nx" onclick="next()">Next →</button></div>`;
else ctl=P.s==='ask'?`<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer" placeholder="${d==='ED'?(c.article?'Type it with the article':'Type the German'):'Type the English'}"><div class="row ctl"><button class="btn r" onclick="dunno()">Don’t know</button><button class="btn" onclick="check()">Check</button></div>`:`<div class="row ctl"><button class="btn" id="nx" onclick="next()">Next →</button></div>`;
const last=`<div class="last">${P.last?`<span>Last: <b>${esc(P.last.w)}</b> <span class="${P.last.r}">${P.last.r==='r'?'✓ right':P.last.r==='w'?'✗ wrong':'? didn’t know'}</span></span><button class="btn gh sm" onclick="undo()" title="Undo last answer (Z)">↩ Undo</button>`:''}</div>`;
const dots=t.missed?`<span class="dots" title="Correct answers in a row needed to leave Missed words">${'●'.repeat(t.sip||0)}${'○'.repeat(5-(t.sip||0))}</span>`:'';
return `<div class="pw"><div class="meta"><span class="tag">${c.level==='MY'?'MY':c.level}</span><span>${P.i+1} / ${P.q.length}</span><button class="btn gh sm" onclick="toggleMode()">${sw?'Swipe':'Type'} ⇄</button><button class="btn gh sm" onclick="finish()">End</button></div>${last}
<div id="card" class="card"><span class="stamp sl">${st[0]}</span><span class="stamp sr">${st[1]}</span><span class="lab">${d==='ED'?'EN → DE':'DE → EN'}</span>${dots}<div class="big">${esc(pr)}</div>${P.s!=='ask'?`<hr><div class="big a">${an}</div>`:''}${P.fb?`<div class="fb" role="status">${esc(P.fb)}</div>`:''}${showDe?`<button class="btn gh sm spk" onclick="say(${esc(JSON.stringify(art(c)+c.de))})" aria-label="Pronounce the German word (P)">🔊</button>`:''}</div>${ctl}</div>`},
summary(){if(!P)return views.start();const r=P.res,tot=r.ok+r.bad+r.skip,pc=tot?Math.round(100*r.ok/tot):0,win=pc>=80,m=missedN();
const msg=!tot?['Session ended','You left before answering anything. The cards feel a little rejected.']:win?['🎉 Congratulations!',(P.wl=P.wl||pick(WINLINES))+' You unlocked the dancing stick man.']:pc>=60?['😎 Nicht schlecht!','Not bad at all. The stick man is stretching backstage. Hit 80% to bring him out.']:pc>=40?['🤔 Halfway there','The stick man refuses to dance for less than 80%. He has standards.']:['😬 Autsch','Even Google Translate looks worried. Your missed words want a rematch.'];
return `<div class="sum">${win?STICK:''}<h2>${msg[0]}</h2>${tot?`<p class="pc">${pc}%</p>`:''}<p>${msg[1]}</p>${tot?`<p>📆 Day ${S.dstreak} of your daily streak${(S.freeze||0)?' · 🧊 '+S.freeze+'/2':''}</p>`:''}</div><div class="box"><p>Points: <b>${r.pts}</b> · Correct: <b>${r.ok}</b> · Wrong: <b>${r.bad}</b> · Skipped: <b>${r.skip}</b></p><p>Best streak: <b>${r.best}</b> · Bonuses: <b>${r.bon}</b></p></div>${P.missed.length?`<p><small>${P.missed.length} word(s) from this round went to Missed words.</small></p>`:''}<div class="row">${m?`<button class="btn y" onclick="startSession('MISSED')">Practise missed words (${m})</button>`:''}<button class="btn gh" onclick="go('start')">Home</button></div>`},
dash(){const t=S.ok+S.bad+S.skip,rows=LV.map(l=>{const a=all().filter(w=>w.level===l);return `<tr><td><b>${l}</b></td><td>${a.filter(w=>g(w.id).seen).length}/${a.length}</td><td>${a.filter(w=>g(w.id).box===5).length}</td></tr>`}).join(''),dd=S.backup?Math.floor((Date.now()-S.backup)/864e5):null,late=dd===null||dd>7||S.newSince>=20;
return `<h2>Dashboard</h2>${rankBox()}${dayBox()}${saveBox()}<div class="box"><p>Score <b>${S.score}</b> · Streak <b>${S.streak}</b> · Best <b>${S.best}</b></p><p>Accuracy <b>${t?Math.round(100*S.ok/t):0}%</b> · Missed words <b>${missedN()}</b></p><table width="100%"><tr><td></td><td><small>SEEN</small></td><td><small>MASTERED</small></td></tr>${rows}</table></div>
<div class="box" ${late?'style="border-color:#ffc800"':''}>Last backup: <b>${dd===null?'never':dd+' day(s) ago'}</b>${late?' ⚠️ Export soon.':''}</div>
<div class="row"><button class="btn y" onclick="startSession('MISSED')">Practise missed</button><button class="btn" onclick="exportX()">Export .xlsx</button></div>
<div class="row"><label class="btn gh" style="text-align:center">Import<input type="file" accept=".xlsx,.csv" hidden onchange="imp(this)"></label><button class="btn gh" onclick="exportX(1)">Blank template</button><button class="btn r" onclick="R=true;render()">Reset scores</button></div>
${R?`<div class="box"><b>Reset score, streaks and counters?</b> Words are kept.<br><label><input type="checkbox" id="clr" style="width:auto;margin:8px"> Clear missed words too</label><div class="row"><button class="btn r" onclick="doReset()">Yes, reset</button><button class="btn gh" onclick="R=false;render()">Cancel</button></div></div>`:''}`},
add(){if(!E)return `<h2>Add or edit words</h2><label for="q">Search your words (German or English)</label><input id="q" placeholder="e.g. Hund, decision, Schwachstelle" autocomplete="off" oninput="srch(this.value)"><div id="res"></div><button class="btn" style="width:100%;margin-top:8px" onclick="E={_new:1,en:'',de:'',article:'',plural:'',level:'MY',tp:[]};render();$('f_en').focus()">+ Add a new word</button>`;
const w=E,o=(v,a)=>`<option value="${v}" ${a===v?'selected':''}>${v||'none'}</option>`,t=g(w.id||'');
return `<h2>${w._new?'Add word':'Edit word'}</h2>${w._new?'':`<p><small>Seen ${t.seen} · Correct ${t.c} · Wrong ${t.w}${t.missed?' · in Missed words':''}</small></p>`}<label for="f_en">English (separate options with /)</label><input id="f_en" value="${esc(w.en)}"><label for="f_de">German (without article)</label><input id="f_de" value="${esc(w.de)}"><label for="f_art">Article</label><select id="f_art">${['','der','die','das'].map(v=>o(v,w.article)).join('')}</select><label for="f_pl">Plural (optional)</label><input id="f_pl" value="${esc(w.plural)}"><label for="f_lv">Level</label><select id="f_lv">${LVS.map(v=>o(v,w.level)).join('')}</select><label for="f_tp">Topics (comma-separated, optional)</label><input id="f_tp" list="tpl" value="${esc(w.tp?tpStr(w):'')}"><datalist id="tpl">${TOPICS.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
<div class="row"><button class="btn" onclick="saveWord()">Save</button>${w._new?'<button class="btn p" onclick="saveWord(1)">Save + add another</button>':`<button class="btn r" onclick="delW('${esc(w.id)}')">Delete</button>`}<button class="btn gh" onclick="E=null;render()">Cancel</button></div>`},
settings(){const o=(k,v,t)=>`<button class="btn gh ${S[k]==v?'on':''}" aria-pressed="${S[k]==v}" onclick="S.${k}=${typeof v=='string'?`'${v}'`:v};save();render()">${t}</button>`;
return `<h2>Settings</h2><h2>Google Sheet sync</h2><div class="box">${SH?`<p style="margin:0 0 4px"><b>${esc(syncIcon()+' '+syncText())}</b></p><small>All words, every answer and every finished round are written to your sheet. Edits you make in the sheet show up here after Sync now.</small><div class="row"><button class="btn" onclick="pull(1).then(sync).catch(()=>{})">Sync now</button><button class="btn gh" onclick="disconnect()">Disconnect</button></div>`:`<small>Connect once per browser. Your words and progress then live in your Google Sheet.</small><label for="sh_url" style="display:block;margin-top:8px">Web app URL</label><input id="sh_url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"><label for="sh_t">Secret token</label><input id="sh_t" type="password" autocomplete="off"><button class="btn" onclick="connect()">Connect</button>`}</div><b>Cards per round</b><div class="row">${o('len',25,'25')}${o('len',50,'50')}${o('len',75,'75')}${o('len',100,'100')}</div><b>Sound effects</b><div class="row">${o('snd',1,'On')}${o('snd',0,'Off')}</div><b>Pronounce German automatically</b><div class="row">${o('say',1,'On')}${o('say',0,'Off')}</div><p><small>${TTS?'Using Claude’s voice.':'Using your device’s German voice. Claude’s voice is only available when the app is opened inside claude.ai.'}</small></p><p><small>${WL.length} words in total. Search, edit or add words with the + button.</small></p>`}};
function render(){document.body.classList.toggle('prac',V==='practice');$('app').innerHTML=`<header class="bar"><span class="st">⭐ ${S.score} 🔥 ${S.streak} <span title="Daily streak">📆${S.dstreak||0}</span> <span id="sy" style="cursor:pointer" title="${esc(syncText())}" onclick="go('settings')">${syncIcon()}</span></span><b class="logo" onclick="go('start')"><img src="${ICON}" alt="Flash Me Baby"><span class="lt">Flash Me Baby</span></b><button class="btn sm" aria-label="Add word" onclick="E=null;go('add');setTimeout(()=>{const q=$('q');q&&q.focus()},50)">+</button></header>${W?'<div class="warn" role="button" tabindex="0" onclick="go(\'dash\')">Progress isn’t saving here — tap to open the Dashboard and Export a backup</div>':''}${views[V]()}<nav>${[['start','Start'],['dash','Dashboard'],['settings','Settings']].map(([v,t])=>`<button class="btn gh" onclick="go('${v}')" ${V===v?'aria-current="page"':''}>${t}</button>`).join('')}</nav>`;bind();autoSay()}
function autoSay(){if(!S.say||V!=='practice'||!P||P.i>=P.q.length)return;const c=P.q[P.i],d=P.d[P.i],k=P.i+':'+(d==='DE'?'a':P.s);if((d==='DE'||P.s!=='ask')&&P.said!==P.i){P.said=P.i;say(art(c)+c.de)}}
function bind(){if(V!=='practice'||!P)return;const a=$('ans');if(a)a.focus();const el=$('card');if(!el||S.mode!=='swipe')return;let x0=null;const th=()=>Math.min(innerWidth,640)*.25,sl=el.querySelector('.sl'),sr=el.querySelector('.sr');
el.onpointerdown=e=>{if(e.target.closest('button')||Date.now()<(P.lock||0))return;x0=e.clientX;el.setPointerCapture(e.pointerId);el.style.transition='none'};
el.onpointermove=e=>{if(x0==null)return;const dx=e.clientX-x0,k=Math.min(1,Math.abs(dx)/th());el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;el.style.background=`color-mix(in srgb,${dx>0?'#58cc02':'#ff4b4b'} ${Math.min(40,k*35)}%,var(--card))`;sl.style.opacity=dx<0?k:0;sr.style.opacity=dx>0?k:0};
const up=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;el.style.transition='';if(Math.abs(dx)>th())act(dx>0?1:-1);else{el.style.transform='';el.style.background='';sl.style.opacity=sr.style.opacity=0}};el.onpointerup=up;el.onpointercancel=up}
document.addEventListener('keydown',e=>{if(V!=='practice'||!P)return;const k=e.key,sw=S.mode==='swipe';if((k==='p'||k==='P')&&e.target.tagName!=='INPUT'&&(P.d[P.i]==='DE'||P.s!=='ask')){const c=P.q[P.i];say(art(c)+c.de);return}
if((k==='z'||k==='Z'||k==='Backspace')&&e.target.tagName!=='INPUT'){e.preventDefault();undo();return}
if(P.s==='done'&&(k==='Enter'||k===' ')&&e.target.tagName!=='BUTTON'){e.preventDefault();next();return}
if(sw){if(k==='ArrowRight'||k===' '){e.preventDefault();act(1)}else if(k==='ArrowLeft'){e.preventDefault();act(-1)}}
else if(k==='Enter'&&P.s==='ask'&&e.target.id==='ans')check()});
/* ---- words, reset, excel ---- */
function srch(v){const q=nz(v),el=$('res');if(!el)return;if(q.length<2){el.innerHTML='';return}const hits=[];for(const w of WL){if(nz(w.de).includes(q)||nz(w.en).includes(q)){hits.push(w);if(hits.length>=40)break}}
hits.sort((a,b)=>(nz(a.de)===q||ne(a.en)===q?0:1)-(nz(b.de)===q||ne(b.en)===q?0:1));
el.innerHTML=hits.length?hits.map(w=>`<button class="tile" style="width:100%;margin-top:8px" onclick="editW('${esc(w.id)}')"><span style="flex:1"><b>${esc(art(w)+w.de)}</b><br><small>${esc(w.en)} · ${w.level}</small></span><span>✏️</span></button>`).join('')+(hits.length>=40?'<p><small>Showing the first 40. Type more to narrow it down.</small></p>':''):'<p><small>No match. Add it as a new word below.</small></p>'}
function saveWord(again){const v=i=>$(i).value.trim(),o={en:v('f_en'),de:v('f_de'),article:v('f_art'),plural:v('f_pl'),level:v('f_lv'),tp:tpParse(v('f_tp'))};if(!o.en||!o.de){toast('English and German are required');return}
if(!E._new){Object.assign(E,o);E=null;saveWords();save();toast('Saved ✓');render();return}
const dup=WL.find(w=>nz(w.de)===nz(o.de)&&w.article===o.article);
if(dup){toast('Already exists: '+art(dup)+dup.de+'. Opened it for editing.');E=dup;render();return}
const ens=o.en.split('/').map(ne),syn=WL.find(w=>nz(w.de)!==nz(o.de)&&w.en.split('/').some(a=>ens.includes(ne(a))));
if(syn&&SYN!==o.en+'|'+o.de){SYN=o.en+'|'+o.de;toast('Synonym of '+art(syn)+syn.de+'. Tap Save again to add it anyway');return}SYN=null;
const w=Object.assign({id:'u_'+Date.now().toString(36)},o);WL.push(w);WIX.set(w.id,w);S.newSince++;saveWords();save();toast('Saved ✓');
if(again){E={_new:1,en:'',de:'',article:'',plural:'',level:o.level,tp:o.tp};render();$('f_en').focus()}else{E=null;render()}}
function editW(id){E=WIX.get(id)||null;render();scrollTo(0,0)}
function delW(id){const w=WIX.get(id);if(!w||!confirm('Delete “'+art(w)+w.de+'” and its progress?'))return;WL.splice(WL.indexOf(w),1);WIX.delete(id);delete S.st[id];if(BI.some(b=>b.id===id)&&!S.delb.includes(id))S.delb.push(id);E=null;saveWords();save();toast('Deleted');render()}
function doReset(){const c=$('clr').checked;S.score=S.streak=S.best=S.ok=S.bad=S.skip=0;if(c)Object.values(S.st).forEach(t=>{t.missed=false;t.sip=0});save();go('dash');toast('Scores reset')}
function saveBox(){const t=SH?['☁️ Live-synced to your Google Sheet',syncText()+'. Export below if you also want a file backup.']:MODE==='local'?['⚠️ This browser only','Clearing browser data deletes it. Connect your Google Sheet in Settings.']:['✗ Not saving here','Use Export below to keep a copy of your words and progress.'];return `<div class="box"${SH?'':' style="border-color:#ffc800"'}><small>Saving</small><p style="margin:4px 0"><b>${t[0]}</b></p><small>${esc(t[1])}</small>${SH?'':'<div class="row"><button class="btn gh sm" onclick="go(\'settings\')">Connect Google Sheet</button></div>'}</div>`}
async function exportX(blank){if(typeof XLSX==='undefined'){toast('Excel library not loaded');return}
const rows=blank?[{English:'the decision',German:'Entscheidung',Article:'die',Plural:'Entscheidungen',Level:'MY',Seen:0,Correct:0,Wrong:0}]:all().map(w=>({English:w.en,German:w.de,Article:w.article,Plural:w.plural,Level:w.level,Topics:tpStr(w),Seen:g(w.id).seen,Correct:g(w.id).c||0,Wrong:g(w.id).w||0}));
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Words');const fn=blank?'flash-me-baby-template.xlsx':'flash-me-baby-'+new Date().toISOString().slice(0,10)+'.xlsx',data=XLSX.write(wb,{type:'array',bookType:'xlsx'});
let d=null;try{d=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
if(d){try{await d.save({filename:fn,data})}catch(e){if(!e||e.code!=='declined')toast('Export failed');return}}
else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
if(!blank){S.backup=Date.now();S.newSince=0;save();render();toast('Exported ✓')}}
async function imp(inp){const f=inp.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);let add=0,upd=0;
const key=(d,a)=>nz(d)+'|'+(a||'');
for(const r of rows){const en=String(r.English||'').trim(),de=String(r.German||'').trim(),a=String(r.Article||'').trim().toLowerCase();if(!en||!de)continue;let lv=String(r.Level||'MY').trim().toUpperCase();if(!LVS.includes(lv))lv='MY';
const ex=WL.find(w=>key(w.de,w.article)===key(de,a));
if(ex){if(ex.en!==en){ex.en=en;upd++}}else{const w={id:'u_'+Date.now().toString(36)+add,en,de,article:['der','die','das'].includes(a)?a:'',plural:String(r.Plural||'').trim(),level:lv,tp:tpParse(r.Topics)};WL.push(w);WIX.set(w.id,w);add++}}
saveWords();S.newSince+=add;save();render();toast(`Imported: ${add} new, ${upd} updated`)}catch(e){toast('Could not read that file')}inp.value=''}
intro();
initStore();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
